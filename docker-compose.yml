services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      Cache__Provider: Redis
      ConnectionStrings__Redis: redis:6379
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
